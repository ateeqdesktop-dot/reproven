[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reproven"
version = "0.2.0"
description = "Local-first, explainable release reproducibility verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ReProven Contributors"}]
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML>=6.0", "build>=1.2"]

[project.scripts]
reproven = "reproven.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reproven"]

[tool.pytest.ini_options]
addopts = "-q --cov=reproven --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
